changelog: |-
  1.42.2（台服）
  - 修正分頁頻道全關、聊天區仍然空白。舊設定的 ChatCodes 會再讀回來；已經被清掉的分頁會改為全開
  - 右鍵「發送組隊邀請」仍以 /invite 送出；好友與黑名單同樣走文字指令

  1.42.1（台服）
  - 修正聊天視窗空白：API 13 送來的頻道代碼要先取低 7 位元，否則每一則訊息都被分頁過濾掉
  - 不再因為讀取失敗或資料庫升級而刪除共用的聊天記錄
  - 右鍵「發送組隊邀請」仍以 /invite 送出；好友與黑名單同樣走文字指令

  1.42.0（台服）
  - 改為 Dalamud API 13 / .NET 9，給 XIVTCLauncher 使用
  - 台服世界的右鍵選單恢復「發送組隊邀請」，以 /invite 文字指令送出
  - 好友申請與黑名單同樣改走文字指令
  - 介面語言 tw 會載入繁體中文
