name: Chat 2
author: Infi, Anna
dalamud_api_level: 13
punchline: 電光石火 - 台服用的聊天視窗（非官方移植）
description: |-
  Chat 2 是遊戲內建聊天視窗的完整重寫。
  支援：

  - 無限分頁
  - 固定發送到特定頻道的分頁
  - 更靈活的過濾
  - RGB 頻道顏色
  - 可調字體大小
  - 側邊欄分頁
  - 未讀計數
  - 表情符號
  - 截圖模式（隱藏名稱）

  這個組建給台灣版用戶端：yanmucorp Dalamud API 13、.NET 9、XIVTCLauncher。
  不要裝到官方 Dalamud API 14／15。
  上游是 Infiziert90/ChatTwo，作者 Infi、Anna。這不是官方插件。
repo_url: https://github.com/pollyhaei-ai/ChatTwo
icon_url: https://raw.githubusercontent.com/pollyhaei-ai/ChatTwo/main/ChatTwo/images/icon.png
image_urls:
  - https://raw.githubusercontent.com/pollyhaei-ai/ChatTwo/main/ChatTwo/images/chatWindow.png
  - https://raw.githubusercontent.com/pollyhaei-ai/ChatTwo/main/ChatTwo/images/withSimpleTweaks.png
accepts_feedback: true
tags:
